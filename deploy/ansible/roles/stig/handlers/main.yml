# Handler names carry "(stig)" so they never collide with the baseline role's.
- name: Restart sshd (stig)
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Load audit rules (stig)
  ansible.builtin.command: augenrules --load
  register: stig_augenrules
  changed_when: true
  # Once "-e 2" is loaded the rules are immutable until reboot; the new rules
  # then take effect at the next boot. Any other failure is a failure.
  failed_when: >-
    stig_augenrules.rc != 0
    and 'immutable' not in (stig_augenrules.stdout ~ stig_augenrules.stderr)

- name: Update grub (stig)
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reload sysctl (stig)
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart chrony (stig)
  ansible.builtin.service:
    name: chrony
    state: restarted
