# Install from the bundle. Nothing is unpacked until the tarball's signature
# verifies on the target (verify.yml: SI-7, CM-14): an unsigned or wrongly
# signed bundle is never installed. Integrity is then checked twice more:
# the tarball's published .sha256 here, and the per-file SHA256SUMS inside
# install.sh, which also installs every dependency with --require-hashes.
- name: Bundle names
  ansible.builtin.set_fact:
    bundle_name: "sentinel-{{ sentinel_version }}-{{ sentinel_arch }}"

- name: Signature gate
  ansible.builtin.include_tasks: verify.yml

- name: Verify bundle digest before unpacking
  ansible.builtin.command: sha256sum --strict -c {{ bundle_name }}.tar.gz.sha256
  args:
    chdir: "{{ sentinel_stage_dir }}"
  changed_when: false

- name: Unpack
  ansible.builtin.unarchive:
    src: "{{ sentinel_stage_dir }}/{{ bundle_name }}.tar.gz"
    dest: "{{ sentinel_stage_dir }}"
    remote_src: true

# The node settings go in before install.sh runs, so its first start already
# uses them (install.sh keeps a sentinel.env it finds). The template module
# does not create parent directories: on a fresh host the prefix must be made
# here, as install.sh would make it (root, 0755; the service owns only var/).
- name: Install prefix
  ansible.builtin.file:
    path: "{{ sentinel_prefix }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Node settings
  ansible.builtin.template:
    src: sentinel.env.j2
    dest: "{{ sentinel_prefix }}/sentinel.env"
    mode: "0640"
  notify: Restart sentinel

- name: Install (offline, hash-pinned)
  ansible.builtin.command: ./install.sh
  args:
    chdir: "{{ sentinel_stage_dir }}/{{ bundle_name }}"
  environment:
    PREFIX: "{{ sentinel_prefix }}"
    SENTINEL_ROLE: "{{ sentinel_role }}"
    SYSTEMD: "1"
  register: install
  changed_when: "'installed' in install.stdout"
  notify: Restart sentinel

- name: Service running
  ansible.builtin.service:
    name: sentinel
    state: started
    enabled: true
