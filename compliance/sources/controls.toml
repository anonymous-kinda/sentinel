    "tests/test_tier5_refusal.py::test_every_refusal_records_the_value_that_tripped_it",
    "tests/property/test_crdt.py::test_tampered_entry_is_rejected_not_merged",
    "tests/api/test_ai_api.py::test_empty_or_oversized_questions_are_rejected",
]
files = ["sentinel/cdm/validate.py", "sentinel/conjunction/service.py"]

[[control]]
id = "si-15"
rationale = "A language model may phrase an answer; it must not be able to put an unsupported number in front of an operator."
params = { "si-15_odp" = """The AI assistant's narrated answers, whose numbers must each appear, at the \
stated precision, in the tool results or the operator's question; and every probability of \
collision the API or console shows, which must carry its method.""" }

[[control.by]]
component = "node"
status = "implemented"
statement = """Every AI-written answer passes a number-grounding guard: each number, including numbers \
attached to units, must match a number in the tool results or the question at the precision it is \
stated. Otherwise the answer is withheld, the deterministic template answer is shown, and the \
unsupported numbers are named. Template answers pass the same guard. A Pc never leaves the engine, \
the API or the assistant without its method."""
tests = [
