[[control]]
id = "cm-14"
rationale = "A node must refuse to install software it cannot attribute to its publisher."

[[control.by]]
component = "pipeline"
status = "partial"
statement = """Installation refuses a bundle whose signature does not verify against the approved \
signer. One verifier, deploy/bundle/verify_signature.sh, holds the policy for every install path. \
It accepts exactly one policy: the release workflow's keyless identity, checked offline against \
the Sigstore trusted root (whose SHA-256 is pinned), or a site public key. No policy, two \
policies, a missing signature bundle, or a trusted root that does not match its pin is refused \
before cosign runs, and a rejected signature fails closed. On every push the supply-chain CI job \
runs the verifier with the pinned cosign in a namespace with no network: a good signature \
verifies; a tampered artifact, another key's signature and a wrong identity are rejected; a real \
Sigstore public-good signature verifies offline (deploy/bundle/selftest_signature.sh). The same \
job runs the Ansible role's gate on localhost (deploy/ansible/tests/test_verify.sh): a tampered \
bundle with a regenerated digest, a missing policy and another signer's identity are refused. \
The airgap-install CI job runs the full offline install behind the gate on every push, for each \
architecture (make airgap-local): it builds a bundle, signs it with a throwaway key, and in a \
namespace with no network verifies that signature before unpacking, installs and runs the node. \
Not yet proven: releases are signed keyless only by the sign job of .github/workflows/release.yml, \
which runs on a tag on GitHub, has been checked only statically (actionlint) and has not run yet, \
so no Sentinel release signature exists, and the full install is exercised on every push only in \
key mode, not against the release workflow's keyless identity. Unpacking a bundle by hand and \
running install.sh skips the gate by construction: a script inside a bundle cannot vouch for that \
bundle."""
tests = [
    "tests/supplychain/test_verify_signature.py::test_keyless_verifies_against_the_bundle_trust_root_identity_and_issuer",
    "tests/supplychain/test_verify_signature.py::test_keyless_never_skips_the_transparency_log",
    "tests/supplychain/test_verify_signature.py::test_a_rejected_signature_fails_closed",
    "tests/supplychain/test_verify_signature.py::test_no_policy_is_refused_before_cosign_runs",
    "tests/supplychain/test_verify_signature.py::test_two_policies_at_once_are_refused",
    "tests/supplychain/test_verify_signature.py::test_keyless_without_an_identity_is_refused",
    "tests/supplychain/test_verify_signature.py::test_a_missing_signature_bundle_is_refused",
    "tests/supplychain/test_verify_signature.py::test_a_pinned_trusted_root_digest_is_checked_before_use",
]
ci = ["ci.yml#supply-chain", "ci.yml#airgap-install"]
files = [
    "deploy/bundle/verify_signature.sh", "deploy/bundle/selftest_signature.sh", "deploy/bundle/verify_offline.sh",
    "deploy/ansible/roles/sentinel/tasks/verify.yml", "deploy/ansible/roles/sentinel/defaults/main.yml",
    "deploy/ansible/tests/test_verify.sh", ".github/workflows/release.yml", "docs/supply-chain.md",
]
plan = """Push the first release tag and confirm that the sign job's offline verification and the verify \
job (keyless signature, install and run under unshare -rn) pass on both architectures."""
milestone = "M4"

