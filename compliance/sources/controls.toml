[[control]]
id = "si-10"
rationale = """The engine's answer is only as good as its input: a CDM in the wrong units or frame produces \
a confident, wrong Pc."""
params = { "si-10_odp" = """Conjunction Data Messages (CCSDS 508.0-B-1 KVN) submitted for ingest or \
fetched from a hub; decision-log entries received from peer nodes; operator questions to the assistant.""" }

[[control.by]]
component = "node"
status = "implemented"
statement = """Every CDM passes an admission policy: input that would make the answer wrong (wrong unit \
labels, a non-inertial frame, a partial covariance, non-finite states, a header miss distance that \
contradicts the states) is quarantined with a named reason; input that only makes it incomplete (no \
covariance at all, an anomalous unit on a summary field) is accepted with a recorded warning and \
degrades to geometry only. Text that is not a CDM is rejected. The risk engine never raises on bad \
data: it returns REFUSED with the value that tripped the gate. Peer decision-log entries are \
verified before merge; assistant questions are bounded in size."""
tests = [
    "tests/test_cdm_codec.py::test_wrong_messages_are_rejected_with_a_named_reason",
    "tests/test_cdm_codec.py::test_absent_covariance_degrades_to_geometry_only",
    "tests/test_cdm_codec.py::test_nasa_unit_label_anomaly_is_a_warning_not_a_rejection",
    "tests/test_cdm_codec.py::test_rejects_text_that_is_not_a_cdm",
    "tests/api/test_api.py::test_upload_is_idempotent_and_wrong_input_is_quarantined",
