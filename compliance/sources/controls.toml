rationale = "The same bundle installs in an air-gapped enclave; everything in it must be pinned and checked."

[[control.by]]
component = "pipeline"
status = "partial"
statement = """The supply-chain controls are documented in docs/supply-chain.md, and the supply-chain CI \
job runs them on every push: SBOMs with a completeness gate (CM-8), a Trivy scan that fails on any \
finding no reviewed VEX statement answers (RA-5), and offline signature verification with the real \
cosign (CM-14, SI-7). Third-party binaries and trust material are pinned by version and SHA-256 \
(deploy/tools.lock); a mismatch writes nothing (scripts/fetch_tools.py, used by every job that \
fetches a tool). Python dependencies are hash-locked in uv.lock. The CI jobs that test and assess \
install exactly the lock with uv sync --locked, which refuses a stale lock, and a test fails any \
workflow that installs with pip or uv pip instead, since those resolve afresh; a bundle installs \
them offline with --require-hashes. Upstream data (NASA CARA, CelesTrak, NIST, DISA) is vendored \
unmodified with provenance and checksums that the tests verify. Every action in every workflow is \
pinned by commit SHA, which a test enforces (tests/test_workflows_pinned.py). Not yet done: \
signing, SLSA provenance and SBOM attestation of releases exist only in release.yml, which has not \
run yet."""
