    "tests/ai/test_narrate.py::test_a_pc_is_never_stated_without_its_method",
    "tests/test_tier6_contract.py::test_pc_never_travels_without_method",
    "tests/api/test_api.py::test_every_pc_travels_with_its_method",
]
files = ["sentinel/ai/grounding.py"]

[[control]]
id = "si-17"
rationale = """The two failures Sentinel is built for are losing the link and receiving input the method \
cannot handle; in both it must fail to a known, honest state."""
params = { "si-17_odp.02" = """Loss or degradation of the link to the hub (DENIED, DEGRADED, INTERMITTENT, \
LIMITED); a hosted AI service failing or unreachable; conjunction inputs outside the 2D Pc method's \
validity (low relative velocity, curvilinear uncertainty, absent or non-positive-definite covariance).""", "si-17_odp.01" = """The node keeps \
serving its console and recording signed decisions on local data, and reconciles when the link \
returns; the assistant falls back to its local router and templates within the same answer and says \
so; the risk engine returns REFUSED with the reason and the value that tripped the gate instead of a Pc.""" }

[[control.by]]
component = "node"
status = "implemented"
statement = """With the link denied, an edge keeps serving its console (2.7 ms p95 while cut off in the \
last recorded run) and records signed decisions locally; on reconnect nothing is lost, concurrent \
edits are kept as a CONFLICT, and decisions made against superseded CDMs are flagged REVIEW \
REQUIRED. Until a CDM has been fetched and re-assessed locally, an edge shows the event as \
HUB-ASSERTED, never as verified. A failing hosted AI call falls back to the local router or \
templates within the same answer. The risk engine refuses, with the reason and the tripping value, \
every event NASA CARA says the 2D method cannot handle."""
tests = [
    "tests/test_tier5_refusal.py::test_low_relative_velocity_is_refused",
    "tests/test_tier5_refusal.py::test_non_positive_definite_covariance_is_refused_not_repaired",
    "tests/test_tier5_refusal.py::test_missing_covariance_is_refused_with_no_fallback",
    "tests/test_tier5_refusal.py::test_long_curved_along_track_uncertainty_is_refused",
    "tests/test_tier3_cara_validation.py::test_gate_refuses_every_event_cara_says_2d_cannot_handle",
    "tests/sync/test_hub_edge.py::test_edge_sees_every_event_as_hub_asserted_before_any_cdm_arrives",
    "tests/ai/test_assistant.py::test_a_jev_outage_falls_back_to_the_local_router",
    "tests/ai/test_assistant.py::test_a_narrator_outage_falls_back_to_templates",
]
harness = ["denied", "intermittent", "recovery"]
files = ["docs/ddil-results.md"]

