# Sentinel's tailored NIST SP 800-53 Rev 5 baseline: why each control is in
# it, and what each component does about it.
#
# Rules (enforced by compliance/sources.py and tests/compliance/):
#   * status "implemented" needs automated evidence: tests (pytest node ids),
#     harness scenarios, or CI jobs (workflow.yml#job). Files alone are not
#     enough: a file shows intent, a check shows it holds.
#   * "partial" and "planned" need a plan; each becomes a POA&M item.
#   * every cited test, file, job and scenario must exist (checked on every
#     run); planned_evidence names what does not exist yet.
#   * a statement claims only what its evidence shows.
#
# Components: node, nats, host, aws, pipeline, program (system.toml).

# ============================================================== ACCESS CONTROL
[[control]]
id = "ac-2"
rationale = "Operators record decisions that must be attributable, and administrators hold root on nodes."

[[control.by]]
component = "node"
status = "planned"
statement = """The node has no user accounts. It records the operator identity that the front proxy \
asserts in the X-Sentinel-Operator header (sentinel/api/identity.py) and does not authenticate it."""
files = ["sentinel/api/identity.py"]
plan = """Put an authenticating proxy (OIDC, or mTLS with CAC/PIV) in front of every node that sets \
X-Sentinel-Operator from the verified identity and strips any client-supplied value; manage operator \
accounts in the organization's identity provider. The current Caddyfile does neither."""

[[control.by]]
component = "host"
status = "partial"
statement = """The installer creates a system account, sentinel, with no login shell, and the service \
runs as it (deploy/bundle/install.sh, deploy/systemd/sentinel.service). Root cannot log in over SSH \
(baseline role) or directly (STIG role, UBTU-24-400110); accounts are disabled 35 days after password \
expiry (UBTU-24-200260); each account is limited to 10 sessions (UBTU-24-200000); changes to account \
files are audited (UBTU-24-200280 to UBTU-24-200320)."""
tests = ["tests/compliance/test_deploy_conformance.py::test_service_runs_unprivileged_sandboxed_and_on_loopback"]
files = ["deploy/bundle/install.sh", "deploy/ansible/roles/stig/tasks/accounts.yml", "deploy/ansible/roles/stig/files/stig.rules"]
plan = "Apply the STIG role to the hub and verify it with the OpenSCAP scan (stig_scan: true)."

[[control]]
id = "ac-3"
rationale = "A public node must refuse writes, and replicas must accept decisions only from trusted nodes."

[[control.by]]
component = "node"
status = "partial"
statement = """A read-only node (SENTINEL_READ_ONLY, set on the public hub) answers reads and refuses \
writes with 403: CDM ingest and AI draft confirmation are tested; the decision, note and annotation \
endpoints call the same guard (sentinel/api/app.py). A replica merges decision-log entries only from \
nodes in its trust store; others are rejected before merge and recorded. There is no per-operator \
authorization: any identity the proxy asserts may write."""
tests = [
    "tests/api/test_api.py::test_read_only_node_refuses_ingest",
    "tests/api/test_ai_api.py::test_a_read_only_node_answers_but_never_records",
    "tests/property/test_crdt.py::test_untrusted_node_is_rejected",
]
files = ["sentinel/api/app.py", "sentinel/crdt/log.py", "deploy/ansible/roles/sentinel/templates/sentinel.env.j2"]
plan = """Test the read-only refusal on the decision, note and annotation endpoints; authorize by role \
once operators are authenticated (IA-2), for example so that only a designated role may record a \
MANEUVER decision or resolve a conflict."""

[[control.by]]
component = "host"
status = "partial"
statement = """The service runs sandboxed by systemd: read-only filesystem except its own var \
directory, no new privileges, no capabilities, restricted address families and system calls, UMask \
0077. The node's signing key is written readable only by its owner (mode 0600, \
sentinel/crdt/signing.py). AppArmor is installed and enabled (STIG role, UBTU-24-100500, UBTU-24-100510)."""
tests = ["tests/compliance/test_deploy_conformance.py::test_service_runs_unprivileged_sandboxed_and_on_loopback"]
files = ["deploy/systemd/sentinel.service", "sentinel/crdt/signing.py", "deploy/ansible/roles/stig/tasks/packages.yml"]
plan = "Verify the sandbox on a deployed host (systemd-analyze security) and apply the STIG role."

[[control]]
id = "ac-4"
rationale = """A ground unit's position and its pass windows must never leave the edge that holds them, \
and nothing leaves a node for a hosted AI service unless policy allows it."""
params = { "ac-04_odp" = """Leafnode subject permissions: an edge never exports unit.>, passes.> or node.> \
to its hub and never imports node.>; console events are published only on node-scoped subjects \
(node.<id>.>); requests leave a node for a hosted AI service only with an UNCLASSIFIED marking, \
operator opt-in and a usable measured link.""" }

[[control.by]]
component = "nats"
status = "implemented"
statement = """OPSEC by architecture (ADR-010): the edge's leafnode remote denies exporting unit.>, \
passes.> and node.>, and denies importing node.> (deploy/nats/edge.conf.tmpl); console events use \
node-scoped subjects (sentinel/bus/subjects.py, ADR-009); and a unit's position is not a sync record. \
The OPSEC harness scenario shows it on a real leaf link: with a unit set on the edge and its passes \
computed, nothing the hub's nats-server carries contains the unit's id or coordinates in any checked \
serialization, a deliberate canary on unit.>, passes.> and node.> never reaches the hub, and the hub \
holds no unit - with controls showing each negative is not vacuous."""
tests = [
    "tests/compliance/test_deploy_conformance.py::test_edge_never_exports_unit_passes_or_node_subjects",
    "tests/test_harness_opsec.py::test_it_finds_binary_coordinates_in_cbor_and_raw_floats",
    "tests/test_harness_opsec.py::test_it_stays_silent_on_what_legitimately_crosses_the_link",
]
harness = ["opsec"]
files = ["deploy/nats/edge.conf.tmpl", "sentinel/bus/subjects.py", "harness/opsec.py"]

[[control.by]]
component = "node"
status = "implemented"
statement = """The assistant's tier policy is a pure function of the classification marking, operator \
opt-in (SENTINEL_AI_CLOUD) and the measured link state: hosted AI needs an UNCLASSIFIED marking and \
opt-in, and a DENIED link or any other marking means local only. With hosted AI not allowed, no \
request leaves the node."""
tests = [
    "tests/ai/test_policy.py::test_tier_table",
    "tests/ai/test_assistant.py::test_denied_or_classified_never_calls_a_hosted_service",
    "tests/api/test_ai_api.py::test_hosted_providers_are_used_only_with_opt_in",
]
files = ["sentinel/ai/policy.py"]

[[control]]
id = "ac-6"
rationale = "The AI layer must have no path to the maths, and the service and hub need no more privilege than they use."

[[control.by]]
component = "node"
status = "implemented"
statement = """Least privilege between modules is a contract checked in CI: import-linter forbids the AI \
layer from importing the risk engine, the CDM codec, numpy and scipy, confines the hosted AI SDKs to \
their two adapter modules, and keeps the bus, sync, CRDT and triage layers free of mission modules \
(.importlinter)."""
ci = ["ci.yml#python"]
files = [".importlinter"]

[[control.by]]
component = "host"
status = "partial"
statement = """The node runs as the unprivileged sentinel account with no capabilities and no new \
privileges, bound to loopback behind Caddy (deploy/systemd/sentinel.service)."""
tests = ["tests/compliance/test_deploy_conformance.py::test_service_runs_unprivileged_sandboxed_and_on_loopback"]
files = ["deploy/systemd/sentinel.service"]
plan = "Verify on a deployed host; the automation account's NOPASSWD sudo is a STIG deviation (UBTU-24-300020)."

[[control.by]]
component = "aws"
status = "partial"
statement = """The hub's instance role carries one policy, AmazonSSMManagedInstanceCore (Session \
Manager): no S3, no secrets, no administrative access."""
tests = ["tests/compliance/test_deploy_conformance.py::test_hub_infrastructure_encrypts_restricts_admin_and_closes_the_leaf_port"]
ci = ["ci.yml#infra"]
files = ["deploy/aws/terraform/main.tf"]
plan = "Confirm the deployed role's effective permissions (IAM Access Analyzer) when the hub is deployed."

[[control]]
id = "ac-17"
rationale = "Administrators reach nodes remotely; the path must be narrow and strongly protected. The STIG's SSH rules map here (DISA CCI list)."

[[control.by]]
component = "host"
status = "partial"
statement = """SSH accepts public keys only (password and keyboard-interactive authentication off), \
refuses root, allows three authentication attempts and drops idle sessions after 300 seconds \
(baseline role). The STIG role restricts SSH to DISA's FIPS 140-3 approved ciphers, MACs and key \
exchange algorithms (UBTU-24-100820, UBTU-24-100830, UBTU-24-100840) and rate-limits new SSH \
connections in the host firewall."""
tests = [
    "tests/compliance/test_deploy_conformance.py::test_sshd_baseline_accepts_keys_only_and_times_out_idle_sessions",
    "tests/compliance/test_stig_role.py::test_ssh_algorithms_are_exactly_disas",
]
files = ["deploy/ansible/roles/baseline/tasks/main.yml", "deploy/ansible/roles/stig/tasks/ssh.yml"]
plan = "Apply the STIG role to the hub and verify it with the OpenSCAP scan."

[[control.by]]
component = "aws"
status = "partial"
statement = """SSH (22) is open only to admin_cidr, and the Terraform variable rejects 0.0.0.0/0. AWS \
Session Manager is the break-glass path; IMDSv2 is required."""
tests = ["tests/compliance/test_deploy_conformance.py::test_hub_infrastructure_encrypts_restricts_admin_and_closes_the_leaf_port"]
ci = ["ci.yml#infra"]
files = ["deploy/aws/terraform/main.tf", "deploy/aws/terraform/variables.tf"]
plan = "Verify the deployed security group and Session Manager configuration when the hub is deployed."

# ================================================== AUDIT AND ACCOUNTABILITY
[[control]]
id = "au-2"
rationale = "Decisions, AI interactions and rejected input must be reconstructable after the fact."

[[control.by]]
component = "node"
status = "implemented"
statement = """The node logs: every assistant question and every confirmation, one line each in a \
hash-chained audit log; every decision, note, resolution and confirmed AI draft, as signed \
decision-log entries; every CDM admitted or quarantined, with the reason; and service events as \
structured JSON logs whose messages are constants, so they can be searched and alerted on."""
tests = [
    "tests/ai/test_assistant.py::test_every_ask_and_confirm_is_audited_in_a_verifiable_chain",
    "tests/api/test_api.py::test_upload_is_idempotent_and_wrong_input_is_quarantined",
    "tests/test_logging_policy.py::test_log_messages_are_constants_with_values_as_fields",
    "tests/test_obs.py::test_json_formatter_emits_one_object_per_line",
    "tests/test_ops_log.py::test_resolving_a_conflict_appends_a_signed_resolution_naming_what_it_superseded",
]
files = ["sentinel/audit/chain.py", "sentinel/crdt/log.py", "sentinel/obs.py", "sentinel/ops/service.py"]

[[control.by]]
component = "host"
status = "partial"
statement = """auditd records changes to account files, use of su and sudo, changes to sudoers and \
kernel module loading and unloading, from boot (audit=1), with the rules immutable until reboot \
(STIG role; the rules are taken verbatim from DISA's fix text)."""
tests = ["tests/compliance/test_stig_role.py::test_audit_rules_are_the_fix_text_rules"]
files = ["deploy/ansible/roles/stig/files/stig.rules", "deploy/ansible/roles/stig/tasks/audit.yml"]
plan = """Apply the STIG role and scan; review the selected event types with the ISSO, which AU-2 \
also asks for."""

[[control]]
id = "au-3"
rationale = "A decision record is useful only if it says who, what, when, where and against which data."

[[control.by]]
component = "node"
status = "implemented"
statement = """A decision-log entry records its author (the operator identity the proxy asserts; see \
IA-2), the authoring node and its sequence (the dot), wall time and Lamport time, the kind and body \
of the decision, the event and CDM message it was made against, the previous entry's hash and an \
Ed25519 signature. The entry that resolves a conflict also names the field, the new value and each \
value it superseded, with that value's author and node. An AI audit record carries its sequence, time, author, the question, the tier, \
the chosen route, which narrator phrased the answer, the grounding verdict, any fallback, the \
answer, a hash of the tool facts and the chain hash. Service logs are JSON with time, level, logger, \
message and fields."""
tests = [
    "tests/ai/test_audit.py::test_records_form_a_chain",
    "tests/ai/test_assistant.py::test_a_draft_writes_nothing_until_a_person_confirms_it",
    "tests/test_obs.py::test_message_stays_stable_and_values_become_fields",
    "tests/test_tier6_contract.py::test_result_is_serialisable_for_the_decision_log",
    "tests/test_ops_log.py::test_resolving_a_conflict_appends_a_signed_resolution_naming_what_it_superseded",
]
files = ["sentinel/crdt/log.py", "sentinel/ai/assistant.py", "sentinel/obs.py", "sentinel/ops/service.py"]

[[control]]
id = "au-6"
rationale = "Tamper evidence is worth little unless someone checks it and acts on what it shows."

[[control.by]]
component = "node"
status = "partial"
statement = """The node verifies its AI audit chain on request (GET /api/ai/audit/verify) and names the \
first bad line; it verifies every decision-log signature on merge and shows the result per entry; \
it surfaces for review what replication cannot decide: concurrent edits (CONFLICT) and decisions \
made against a CDM that has since been superseded (REVIEW REQUIRED)."""
tests = [
    "tests/api/test_ai_api.py::test_the_audit_chain_is_served_persisted_and_verifies",
    "tests/sync/test_hub_edge.py::test_operator_data_merges_both_ways_and_conflicts_are_kept",
    "tests/sync/test_hub_edge.py::test_decision_becomes_review_required_when_its_cdm_is_superseded",
]
harness = ["denied"]
plan = """Forward the structured logs and audit records to a collector when the link allows, and \
alert on a failed chain verification instead of reporting it only when asked."""

[[control.by]]
component = "program"
status = "planned"
statement = "Who reviews audit records, how often, and to whom findings are reported are not defined."
plan = "Define the review cadence, the reviewers and the reporting path with the ISSO."

[[control]]
id = "au-9"
rationale = "The decision log is the record of what operators decided; it must be tamper-evident on every node."

[[control.by]]
component = "node"
status = "partial"
statement = """The AI audit log is hash-chained: editing or deleting a line is detected at that line. \
Decision-log entries are Ed25519-signed and hash-chained per node; a tampered entry is rejected \
before merge, and a replica that sees one dot with two different contents stops rather than choose. \
A decision made offline at an edge arrives at the hub with a valid signature. Truncating the newest \
lines of the AI audit log leaves a shorter chain that still verifies."""
tests = [
    "tests/ai/test_audit.py::test_editing_a_line_is_detected_at_that_line",
    "tests/ai/test_audit.py::test_deleting_a_line_is_detected",
    "tests/property/test_crdt.py::test_tampered_entry_is_rejected_not_merged",
    "tests/property/test_crdt.py::test_same_dot_with_different_content_raises",
]
harness = ["denied"]
files = ["sentinel/audit/chain.py", "sentinel/crdt/log.py", "sentinel/crdt/signing.py"]
plan = """Anchor the AI audit chain's head outside the file (in the signed decision log, or at the \
hub on reconnect) so truncation is detectable, and alert on a failed verification."""

[[control.by]]
component = "host"
status = "partial"
statement = """Audit rules are immutable once loaded (-e 2, UBTU-24-909000); the service writes its \
data under UMask 0077 in a directory only it can write (deploy/systemd/sentinel.service)."""
tests = [
    "tests/compliance/test_stig_role.py::test_audit_rules_end_immutable",
    "tests/compliance/test_deploy_conformance.py::test_service_runs_unprivileged_sandboxed_and_on_loopback",
]
files = ["deploy/ansible/roles/stig/files/stig.rules"]
plan = "Apply the STIG role and scan; the audit-log file permission rules (UBTU-24-901300 and following) are not yet in the role."

[[control]]
id = "au-10"
rationale = "Signed decisions: a decision cannot later be disowned or attributed to another node."

[[control.by]]
component = "node"
status = "partial"
statement = """Every decision-log entry is signed with its authoring node's Ed25519 key and verified \
against the trust store on merge, so no node can alter another's entries or author entries in its \
name. A confirmed AI draft carries its provenance: router, confidence, model and the audit \
sequence of the question. The operator identity inside an entry is asserted by the proxy, not \
authenticated, so non-repudiation holds for the node, not yet for the person."""
tests = [
    "tests/property/test_crdt.py::test_tampered_entry_is_rejected_not_merged",
    "tests/property/test_crdt.py::test_untrusted_node_is_rejected",
    "tests/sync/test_hub_edge.py::test_operator_data_merges_both_ways_and_conflicts_are_kept",
    "tests/ai/test_assistant.py::test_a_draft_writes_nothing_until_a_person_confirms_it",
]
harness = ["denied"]
files = ["sentinel/crdt/signing.py", "sentinel/crdt/log.py"]
plan = """Bind each entry to an authenticated operator (IA-2), for example with a per-operator \
signature from a CAC/PIV key alongside the node's."""

# ================================================ ASSESSMENT AND AUTHORIZATION
[[control]]
id = "ca-7"
rationale = "Evidence is regenerated on every change, not collected once for an assessment."

[[control.by]]
component = "pipeline"
status = "implemented"
statement = """Every push and pull request runs the full test ladder with the network disabled, lint, \
the module-boundary contracts, the type check, reproducibility checks of the generated reports, the \
interface control documents and the requirement trace, Terraform and Ansible validation, secret \
scanning over the full history, lint of the workflows, the container file and the deploy scripts, \
and the supply-chain checks: SBOMs with a \
completeness gate, a vulnerability scan that fails on any finding no reviewed VEX statement \
answers, and offline signature verification with the real cosign. The DDIL harness runs on changes \
to the layers it exercises and nightly with a 15-minute denial. Every CI run regenerates this \
package's assessment results and POA&M from its own test evidence."""
tests = ["tests/test_typecheck.py::test_ci_runs_the_type_check"]
ci = [
    "ci.yml#python", "ci.yml#infra", "ci.yml#secrets", "ci.yml#compliance", "ci.yml#supply-chain",
    "ci.yml#release-lint", "ci.yml#mbse", "harness.yml#scenario",
]

[[control.by]]
component = "program"
status = "planned"
statement = """A continuous monitoring strategy (metrics, frequencies, who receives the results) is not \
defined, and nothing monitors a deployed node's security state over time."""
plan = """Define the strategy with the ISSO; add scheduled vulnerability scans (RA-5) and periodic STIG \
scans of deployed hosts, reported through this package's POA&M."""

# ================================================== CONFIGURATION MANAGEMENT
[[control]]
id = "cm-2"
rationale = "A node installs identically in the cloud, at the edge and in an air-gapped enclave only if its baseline is code."

[[control.by]]
component = "pipeline"
status = "implemented"
statement = """The baseline is code under version control: hash-locked Python dependencies (uv.lock), \
third-party binaries pinned by version and SHA-256 (deploy/tools.lock), the bundle build \
(scripts/build_bundle.py), the Ansible roles, the Terraform and the NATS configuration templates. \
The Python baseline that CI tests is the declared one: the jobs that test, lint, type-check and assess \
install exactly uv.lock with uv sync --locked, which refuses a lock that no longer matches \
pyproject.toml, and a test fails any workflow that installs with pip or uv pip instead, since those \
resolve afresh. make install uses the same command. CI checks the Terraform (fmt, validate) and the \
playbook's syntax on every push."""
tests = [
    "tests/test_workflows_pinned.py::test_python_dependencies_install_from_the_lock",
    "tests/test_workflows_pinned.py::test_the_lock_check_catches_a_fresh_resolve",
]
ci = ["ci.yml#infra", "ci.yml#python"]
files = [
    "uv.lock", "pyproject.toml", "Makefile", "deploy/tools.lock", "scripts/build_bundle.py", "deploy/ansible/site.yml",
    "deploy/aws/terraform/main.tf", "deploy/nats/edge.conf.tmpl",
]

[[control]]
id = "cm-3"
rationale = "A change to the engine or the sync layer changes what operators are told; it must be tested and traceable."

[[control.by]]
component = "pipeline"
status = "partial"
statement = """Every change is a git commit, and every push and pull request runs the checks listed \
under CA-7. Generated documents (the validation report, the AI eval report, this package's authored \
OSCAL documents) are regenerated and compared in CI, so a change cannot alter them silently. Branch \
protection and required review are GitHub settings and are not evidenced in the repository."""
tests = ["tests/compliance/test_package_integrity.py::test_committed_documents_are_what_the_sources_generate"]
ci = ["ci.yml#python", "ci.yml#compliance"]
plan = "Require the CI checks and one review before merging to main, and record the setting as code."

[[control.by]]
component = "program"
status = "planned"
statement = "Change approval authority and security impact analysis are not defined."
plan = "Name the approver for changes to the risk engine, the sync layer and deployment configuration."

[[control]]
id = "cm-6"
rationale = "Vendor defaults assumed a LAN and would have broken a satellite-linked edge; settings must be deliberate and documented."

[[control.by]]
component = "nats"
status = "implemented"
statement = """The NATS settings that differ from vendor defaults are documented with the measured \
reason (docs/system-design.md, Findings from the DDIL harness) and guarded by harness scenarios: \
no_advertise on the hub's leaf listener, a 20-second first-INFO timeout and a 30-second leaf \
authorization timeout for thin links, and a 5-second ping interval with 3 missed pings to detect a \
black-holed link."""
tests = ["tests/compliance/test_deploy_conformance.py::test_nats_settings_carry_the_ddil_fixes"]
harness = ["recovery", "limited", "denied"]
files = ["deploy/nats/hub.conf.tmpl", "deploy/nats/edge.conf.tmpl", "docs/system-design.md"]

[[control.by]]
component = "host"
status = "partial"
statement = """The STIG role applies 55 rules of the DISA Ubuntu 24.04 STIG V1R6 as code, records 25 \
documented deviations and 8 rules not applicable to a headless server (compliance/sources/stig.toml). \
The values it writes are compared with DISA's text in the tests, and it checks the effective \
configuration (sshd -T, sysctl) before it finishes."""
tests = [
    "tests/compliance/test_stig_role.py::test_every_applied_rule_is_implemented_by_the_role",
    "tests/compliance/test_stig_role.py::test_ssh_algorithms_are_exactly_disas",
]
ci = ["ci.yml#infra"]
files = ["deploy/ansible/roles/stig/tasks/main.yml", "compliance/sources/stig.toml"]
plan = """Apply the role and run its scan on the hub; convert the results to a checklist (.ckl) with \
the MITRE SAF CLI and feed them to the generator (--xccdf)."""

[[control]]
id = "cm-7"
rationale = "A field node should do one job; everything else is attack surface."

[[control.by]]
component = "node"
status = "implemented"
statement = """The public node is read-only and serves only exercise data and NASA's published reference \
set (deploy/ansible/roles/sentinel/templates/sentinel.env.j2); hosted AI is off unless the operator \
opts in; the assistant can be switched off entirely; the console's Content-Security-Policy stops the \
browser from contacting any origin but the node."""
tests = [
    "tests/api/test_api.py::test_read_only_node_refuses_ingest",
    "tests/api/test_api.py::test_console_is_served_under_a_same_origin_content_security_policy",
    "tests/api/test_ai_api.py::test_hosted_providers_are_used_only_with_opt_in",
    "tests/api/test_ai_api.py::test_the_assistant_can_be_switched_off",
]
files = ["deploy/ansible/roles/sentinel/templates/sentinel.env.j2"]

[[control.by]]
component = "host"
status = "partial"
statement = """The STIG role removes telnetd, rsh-server, the NFS packages and ntp, disables USB mass \
storage, and denies inbound connections by default except SSH, the console and ACME; the service \
may use only IPv4, IPv6 and Unix sockets."""
tests = ["tests/compliance/test_deploy_conformance.py::test_service_runs_unprivileged_sandboxed_and_on_loopback"]
files = ["deploy/ansible/roles/stig/tasks/packages.yml", "deploy/ansible/roles/stig/tasks/firewall.yml", "deploy/ansible/roles/stig/tasks/kernel.yml"]
plan = "Apply the STIG role and scan."

[[control]]
id = "cm-8"
rationale = "An air-gapped enclave must know exactly what it installed."

[[control.by]]
component = "pipeline"
status = "partial"
statement = """Software components are inventoried with versions and hashes. On every push the \
supply-chain CI job writes SPDX 2.3 and CycloneDX SBOMs with the pinned syft for what a bundle \
ships from source: the Python runtime (the hash-locked runtime set and the sentinel wheel, \
installed for the bundle's CPython 3.12 target) and the web console (the production closure of \
web/package-lock.json). The step fails if an SBOM is empty or lacks a component known to ship \
(scripts/sbom.py, step "SBOMs (fails if empty or missing a shipped component)"). The bundle \
builder writes BUNDLE.json, which lists every wheel with its digest and every bundled binary with \
its version, upstream URL and SHA-256, and refuses a binary with no pin for the target \
