name: ddil-harness

# Real processes over a shaped link: two nats-servers joined by a leafnode,
# Toxiproxy on that TCP connection, two Sentinel nodes. Runs on changes to
# the layers it exercises, and nightly with a longer denial.
on:
  pull_request:
    # M3 pass service: the OPSEC scenario also guards sentinel/passes and sentinel/api.
    paths: ["sentinel/sync/**", "sentinel/bus/**", "sentinel/crdt/**", "sentinel/ops/**", "sentinel/linkstate/**", "harness/**", "deploy/nats/**", "sentinel/passes/**", "sentinel/api/**"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [denied, limited, intermittent, degraded, recovery, opsec]  # opsec: NIST AC-4, the unit never reaches the hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv pip install -e ".[dev]"
      - name: Pinned tools (sha256-verified)
        run: uv run python scripts/fetch_tools.py nats-server toxiproxy
      - name: Run ${{ matrix.scenario }}
        run: |
          DENIAL=20
          if [ "${{ github.event_name }}" = "schedule" ]; then DENIAL=900; fi
          uv run python -m harness.run ${{ matrix.scenario }} --denial-s $DENIAL
      - name: Summary
        if: always()
        run: |
          uv run python -c "
          import json,pathlib
          r=json.loads(pathlib.Path('harness/results/${{ matrix.scenario }}.json').read_text())
          print('| assertion | result |'); print('|---|---|')
          [print(f\"| {a['name']} | {'PASS' if a['passed'] else 'FAIL'} {a['detail']} |\") for a in r['assertions']]
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ddil-${{ matrix.scenario }}
          path: harness/results/
