name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Module boundaries (MOSA interfaces)
        run: uv run lint-imports
      # Strict on the core and the risk engine, standard on the rest (pyproject.toml).
      - name: Type check (mypy)
        run: make typecheck
      - name: Test ladder (network disabled)
        run: uv run pytest -q -rs
      - name: Validation report is reproducible
        run: |
          uv run python scripts/validation_report.py
          git diff --exit-code docs/validation-report.md
      - name: AI eval report is reproducible (baseline; Jev needs a key CI never has)
        run: |
          env -u TYPESAFE_API_KEY python scripts/ai_eval.py
          git diff --exit-code docs/ai-eval.md docs/img/ai-reliability.svg
      # >>> interface control documents (docs/icd) >>>
      - name: ICDs are current (OpenAPI re-exported; bus, CDM and sync ICDs held to the code)
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code docs/icd/openapi.json
          uv run pytest -q tests/docs
      # <<< interface control documents (docs/icd) <<<

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.4
      - name: Terraform fmt and validate
        run: |
          terraform -chdir=deploy/aws/terraform fmt -check -recursive
          terraform -chdir=deploy/aws/terraform init -backend=false -input=false
          terraform -chdir=deploy/aws/terraform validate
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Ansible syntax
        working-directory: deploy/ansible
        run: |
          cp inventory.example.ini inventory.ini
          uvx --from ansible-core ansible-playbook --syntax-check site.yml

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- M6 MBSE: requirement trace and SysML v2 syntax (begin) ---------------
  mbse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Requirements trace is reproducible (zero broken references)
        run: |
          make trace
          git diff --exit-code docs/traceability.md
      - name: SysML v2 syntax (pilot grammar via sysml2py, isolated env)
        run: make sysml-check
  # --- M6 MBSE (end) --------------------------------------------------------

  # ---- M4 supply chain (begin) ---------------------------------------------
  # Actions here are pinned by full commit SHA; tools by sha256 in deploy/tools.lock.
  release-lint:
    name: Workflows, container and deploy scripts (actionlint, hadolint, shellcheck)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned linters (sha256-verified)
        run: python3 scripts/fetch_tools.py --arch x86_64 actionlint shellcheck hadolint
      - name: actionlint (with shellcheck on every run block)
        run: .tools/x86_64/actionlint -shellcheck .tools/x86_64/shellcheck
      - name: hadolint
        run: .tools/x86_64/hadolint deploy/containers/Dockerfile
      - name: shellcheck
        run: .tools/x86_64/shellcheck deploy/bundle/*.sh deploy/ansible/tests/*.sh

  supply-chain:
    name: SBOMs, vulnerability gate, offline signature checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv sync --locked
      - name: Pinned tools and trust root (sha256-verified)
        run: python scripts/fetch_tools.py --arch x86_64 syft trivy cosign cosign.sigstore.json sigstore-trusted-root.json
      - name: SBOMs (fails if empty or missing a shipped component)
        run: python scripts/sbom.py
      - name: Vulnerability gate (raw scan, reviewed VEX and its evidence checked, SARIF)
        run: python scripts/scan.py
      - name: Offline signature self-test (real cosign inside unshare -rn)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          deploy/bundle/selftest_signature.sh
      - name: Ansible signature gate refuses tampered and unsigned bundles
        run: deploy/ansible/tests/test_verify.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: sbom-and-scan
          path: |
            dist/sbom/*.json
            dist/scan/*.sarif
            dist/scan/*.json
          if-no-files-found: ignore
  # ---- M4 supply chain (end) -----------------------------------------------

  # >>> compliance (M4) >>>
  # OSCAL package (compliance/, docs/compliance.md): this run's pytest JUnit
  # evidence becomes assessment results and a POA&M, then trestle validates
  # every document. A failing test is recorded in the POA&M before the job
  # fails, so the artifacts always describe the run.
  compliance:
    name: OSCAL package from test evidence (trestle validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Test evidence, assessment results and POA&M, trestle validate
        run: make compliance
      - name: OSCAL documents and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oscal-${{ github.sha }}
          path: |
            compliance/oscal/profiles/
            compliance/oscal/component-definitions/
            compliance/oscal/system-security-plans/
            compliance/oscal/assessment-plans/
            compliance/oscal/assessment-results/
            compliance/oscal/plan-of-action-and-milestones/
            build/compliance/junit.xml
  # <<< compliance (M4) <<<

  # >>> compose (begin) >>>
  # The hub/edge stack in containers (deploy/compose, docs/compose.md): build
  # the sentinel image from this checkout, start hub-nats, hub, toxiproxy,
  # edge-nats and edge, wait until both nodes are healthy, then run the smoke
  # test: sync VERIFIED, DENIED measured with the console answering,
  # reconvergence, and a unit set on the edge still 404 on the hub.
  compose-smoke:
    name: Hub and edge in containers (compose-smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: false
      - name: Install (the smoke test reuses the DDIL harness's helpers)
        run: uv sync --locked
      - name: The compose file as Docker Compose reads it
        run: docker compose -f deploy/compose/compose.yaml config --quiet
      - name: Build and start; returns once both nodes are healthy
        run: make compose-up
      - name: Smoke test
        run: make compose-smoke
      - name: Container state and logs
        if: ${{ failure() }}
        run: |
          docker compose -f deploy/compose/compose.yaml ps --all
          docker compose -f deploy/compose/compose.yaml logs --no-color --timestamps
      - name: Stop and delete the volumes
        if: ${{ always() }}
        run: make compose-down
  # <<< compose (end) <<<

  # >>> offline install (REQ-DEP-002) >>>
  # The whole air-gap install on every push, for each architecture on its own
  # runner, exactly as a developer runs it (make airgap-local): build the
  # console and the bundle, sign it with a throwaway key (generated in a
  # mode-700 temp dir, never stored, destroyed on exit), then, inside
  # `unshare -rn` with only loopback, verify the signature before unpacking,
  # install from hash-pinned wheels, and run the node as a hub: NASA validation
  # reproduced, element sets loaded, console served. No dependency cache is
  # restored, as in a release. Release bundles are signed keyless and
  # re-verified the same way by release.yml.
  airgap-install:
    name: Offline install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Console dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Allow unprivileged user namespaces (unshare -rn)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build, sign, verify, install and run with no network (make airgap-local)
        run: make airgap-local ARCH="${ARCH}"
  # <<< offline install (REQ-DEP-002) <<<
