name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Module boundaries (MOSA interfaces)
        run: uv run lint-imports
      - name: Test ladder (network disabled)
        run: uv run pytest -q -rs
      - name: Validation report is reproducible
        run: |
          uv run python scripts/validation_report.py
          git diff --exit-code docs/validation-report.md

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test
      - run: npm --prefix web run build

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - name: Terraform fmt and validate
        run: |
          terraform -chdir=deploy/aws/terraform fmt -check -recursive
          terraform -chdir=deploy/aws/terraform init -backend=false -input=false
          terraform -chdir=deploy/aws/terraform validate
      - uses: astral-sh/setup-uv@v6
      - name: Ansible syntax
        working-directory: deploy/ansible
        run: |
          cp inventory.example.ini inventory.ini
          uvx --from ansible-core ansible-playbook --syntax-check site.yml

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
