[[claim]]
id = "wp-opsec-wire"
doc = "docs/white-paper.md"
quoted = "the edge received 38 public element sets through sync and computed 57 pass windows for a unit. Every message the hub's server carried was captured (179 messages, 90,804 bytes): none held the unit's id or coordinates, and a deliberate canary on the unit's subjects never arrived. All 10 checks passed"
source = "docs/ddil-results.md"
patterns = ["38 element sets crossed", "57 windows", "hub capture: 179 messages, 90,804 bytes", "| OPSEC | PASS | 10/10 |"]

[[claim]]
id = "wp-opsec-hub"
doc = "docs/white-paper.md"
quoted = "Afterwards the hub has no unit (its unit endpoint returns 404), and none of its 8 files holds the unit."
source = "docs/ddil-results.md"
patterns = ["(HTTP 404)", "(8 files scanned)"]

