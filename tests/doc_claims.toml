# Headline numbers the prose quotes, and where each one comes from.
#
# Checked by tests/test_docs.py. For every claim:
#   - `quoted` appears in `doc`;
#   - every string in `patterns` appears in `source`;
#   - every number in `quoted` matches, at the precision the prose states it,
#     a number in `patterns` (the assistant's grounding rule, ADR-007).
# Matching ignores line breaks and runs of spaces.
#
# When a regenerated report changes a number, its pattern stops matching and
# the test fails. Update the pattern, then the prose, then `quoted`.
# Sources are generated reports (docs/ddil-results.md, docs/validation-report.md,
# docs/ai-eval.md, docs/traceability.md), or the test or pin that asserts the value.

# --- README: the value table an operator reads first ---------------------------

[[claim]]
id = "readme-value-cara"
doc = "README.md"
quoted = "on 53 real operational conjunctions (worst relative error 1.5e-8), and it refuses all 29 events where CARA says the method does not apply"
source = "docs/validation-report.md"
patterns = ["53 real operational conjunctions", "| 53 | **1.5e-08** |", "| **Sentinel refuses** | 29 | 5 |", "| **Sentinel returns Pc** | **0** | 19 |"]

[[claim]]
id = "readme-value-urgent-first"
doc = "README.md"
quoted = "At about 8 kbit/s, the most urgent full CDM arrived in 9.1 s in deadline order, against 136.9 s in arrival order. Both orders moved the whole backlog in about the same time (150.9 s and 149.0 s), so putting the urgent record first costs almost nothing. Medians of 5 runs per mode."
source = "docs/ddil-results.md"
patterns = [
    "over ~8 kbit/s + 600 ms",
    "EDF 9.1 s (8.6–9.1) vs FIFO 136.9 s (135.4–141.7) (15.0x)",
    "| every record delivered or held summary-only | 150.9 s (148.6–150.9) | 149.0 s (147.0–153.8) |",
    "medians over 5 runs per mode",
]

[[claim]]
id = "readme-value-disconnected"
doc = "README.md"
quoted = "Cut off, the edge console answered at 3.2 ms (95th percentile) and all 11 DENIED checks passed. On reconnect, operator data converged in 1.37 s."
source = "docs/ddil-results.md"
patterns = ["p95 3.2 ms over 40 requests", "| DENIED | PASS | 11/11 |", "| convergence_after_reconnect_s | 1.37 |"]

[[claim]]
id = "readme-value-opsec"
doc = "README.md"
quoted = "the hub's server carried 179 messages while the edge computed a unit's passes. None held the unit's id or coordinates, and all 10 OPSEC checks passed."
source = "docs/ddil-results.md"
patterns = ["hub capture: 179 messages, 90,804 bytes", "| OPSEC | PASS | 10/10 |"]

