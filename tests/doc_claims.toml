# Headline numbers the prose quotes, and where each one comes from.
#
# Checked by tests/test_docs.py. For every claim:
#   - `quoted` appears in `doc`;
#   - every string in `patterns` appears in `source`;
#   - every number in `quoted` matches, at the precision the prose states it,
#     a number in `patterns` (the assistant's grounding rule, ADR-007).
# Matching ignores line breaks and runs of spaces.
#
# When a regenerated report changes a number, its pattern stops matching and
# the test fails. Update the pattern, then the prose, then `quoted`.
# Sources are generated reports (docs/ddil-results.md, docs/validation-report.md,
# docs/ai-eval.md, docs/traceability.md), or the test or pin that asserts the value.

