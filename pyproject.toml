[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
dynamic = ["version"]
description = "DDIL-resilient conjunction assessment decision aid"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "nats-py>=2.9",
    "cbor2>=5.6",
    "cryptography>=43",
    "skyfield>=1.49",
]

[project.optional-dependencies]
# Hosted AI providers. Deliberately optional: an air-gapped bundle neither
# needs nor carries them (the tier policy falls back to local routing).
ai = [
    "typesafe-sdk>=0.7",
    "anthropic>=1.8",
]
dev = [
    "typesafe-sdk>=0.7",
    "anthropic>=1.8",
    "pytest>=7",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
    # Reads docs/icd/asyncapi.yaml in its drift test, and deploy/compose/compose.yaml in its tests.
    "pyyaml>=6.0",
    # Validates deploy/compose/compose.yaml against the vendored compose-spec schema.
    "jsonschema>=4.23",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sentinel.__version__" }

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    # Skyfield 1.55 internals under NumPy 2.5; scoped to skyfield so our own deprecations still show.
    "ignore:Setting the dtype on a NumPy array:DeprecationWarning:skyfield.*",
]
markers = [
    "tier1: geometry, no probability",
    "tier2: integration, analytically checkable",
    "tier3: validation against NASA CARA published cases",
    "tier4: max Pc and dilution",
    "tier5: refusal gates",
    "tier6: output contract",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"scripts/**" = ["E402"]

[tool.mypy]
# The checker targets 3.12 while the code supports 3.11 (requires-python, CI
# matrix). numpy 2.5, which the 3.12 dev venv and the 3.12/3.13 CI legs
# install, writes its stubs with PEP 695 `type` statements, and mypy parses
# those only when it targets 3.12 or later. Every leg checks with this one
# target, the 3.11 leg (numpy 2.4 stubs) included. That our own code stays
# 3.11 is held by ruff (target-version py311 rejects 3.12-only syntax) and
# by the 3.11 test leg.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true   # global-only; the rest of --strict is per module below

# Strict on the core (bus, crdt, sync, triage) and the risk engine: every flag
# `mypy --strict` enables, set one by one because a per-module `strict = true`
# turns strict mode on for every module. tests/test_typecheck.py holds this
# list to what `mypy --strict` means in the installed mypy.
[[tool.mypy.overrides]]
module = ["sentinel.bus.*", "sentinel.crdt.*", "sentinel.sync.*", "sentinel.triage.*", "sentinel.risk.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

# TODO(typing): these modules fail standard mypy on invariants the types do
# not yet state (Optional narrowing, untyped attributes). They were under
# active change when checking began; remove each entry as its module is fixed.
[[tool.mypy.overrides]]
module = [
    "sentinel.ai.assistant",
    "sentinel.ai.calibration",
    "sentinel.ai.grounding",
    "sentinel.api.ai_routes",
    "sentinel.api.app",
    "sentinel.conjunction.exercise",
    "sentinel.conjunction.service",
    "sentinel.passes.providers.tabulated",
    "sentinel.screening.derived_cdm",
]
ignore_errors = true

# --- M3 pass engine: ship the imaging catalog inside the wheel --------------
[tool.setuptools.package-data]
"sentinel.passes" = ["imaging.toml"]
# --- end M3 pass engine -------------------------------------------------------
