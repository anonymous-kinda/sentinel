[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "DDIL-resilient conjunction assessment decision aid"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier1: geometry, no probability",
    "tier2: integration, analytically checkable",
    "tier3: validation against NASA CARA published cases",
    "tier4: max Pc and dilution",
    "tier5: refusal gates",
    "tier6: output contract",
]
