[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
dynamic = ["version"]
description = "DDIL-resilient conjunction assessment decision aid"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sentinel.__version__" }

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "tier1: geometry, no probability",
    "tier2: integration, analytically checkable",
    "tier3: validation against NASA CARA published cases",
    "tier4: max Pc and dilution",
    "tier5: refusal gates",
    "tier6: output contract",
    "req(id): links a test to a requirement in mbse/requirements.sysml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
