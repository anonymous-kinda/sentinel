# Sentinel imaging catalog (M3 pass engine). Read by sentinel/passes/catalog.py.
#
# Public high-resolution optical (EO) and radar (SAR) imagers. Every
# norad_id was checked against OBJECT_NAME in the vendored CelesTrak
# snapshot fixtures/omm/celestrak-resource-20260924.json. `name` is the
# OBJECT_NAME prefix the matcher expects.
#
# Every max_off_nadir_deg is a PLANNING ASSUMPTION from a public spec
# sheet, rounded, with its source in `basis`. It is not a measured or
# guaranteed capability. The values err wide: a wider field of regard
# over-reports observed time and never under-reports a gap.
#
# SAR: the maximum incidence angle is recorded as the maximum off-nadir
# angle. Incidence exceeds the look angle, and the near-nadir blind zone
# and the look side are ignored, so the SAR entries err wide too.
#
# gsd_m is the finest nadir sample distance (EO) or resolution (SAR) the
# cited source gives. It is informational: no computation uses it.
#
# Operational status is not asserted. A catalogued imager that is no
# longer tasked over-reports observed time.
#
# Data class: DERIVED (from public sources).

